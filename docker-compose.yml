services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 00000000
      POSTGRES_DB: ecommerce_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "postgresql://postgres:00000000@postgres:5432/ecommerce_db"
      JWT_SECRET: "your-super-secret-jwt-key"
      JWT_REFRESH_SECRET: "your-super-secret-refresh-key"
      JWT_EXPIRES_IN: "15m"
      CLOUDINARY_CLOUD_NAME: "kznj0kgt"
      CLOUDINARY_API_KEY: "269753217238713"
      CLOUDINARY_API_SECRET: "cdQzyEuqp-Zq2SvjNPvBMDMbQkE"
      FRONTEND_URL: "http://localhost:5173"
      ALLOWED_ORIGINS: "http://localhost:5173,http://172.26.32.1:5175"
      AI_SERVICE_URL: "http://ai-service:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "5175:80"
    depends_on:
      - backend

  ai-service:
    build: ./ai-service
    restart: always
    env_file:
      - ./ai-service/.env
    ports:
      - "8001:8001"
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-worker:
    build: ./ai-service
    restart: always
    env_file:
      - ./ai-service/.env
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      - redis
      - backend

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
