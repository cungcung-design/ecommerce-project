version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 00000000
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:00000000@postgres:5432/ecommerce_db"
      JWT_SECRET: "your-super-secret-jwt-key"
      JWT_REFRESH_SECRET: "your-super-secret-refresh-key"
      JWT_EXPIRES_IN: "15m"
      CLOUDINARY_CLOUD_NAME: "your_cloud_name"
      CLOUDINARY_API_KEY: "your_api_key"
      CLOUDINARY_API_SECRET: "your_api_secret"
      FRONTEND_URL: "http://localhost:5173"
      PORT: "5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
